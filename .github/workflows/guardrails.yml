# The per-repo footprint of ADR-085 §C.11. Every check it runs is defined in exeris-systems/.github;
# this file only says which gates apply here and how strictly.
#
# ONE REVIEW, ONE VERDICT, ONE PUBLISHER. The shared routine judges the pull request, its pages, its
# records, the comments in its code and what the code does; this repository's own rules reach it as
# `repo-routine`. The reviewer may not publish (ADR-087 §A.3), so the verdict is posted by
# `exeris-bot` and read by a check.
#
# THIS FILE IS ONE BLOB ON EVERY BRANCH. `claude-code-action` refuses to start when the workflow it
# runs under differs in any byte from the default branch's copy, so a branch whose copy has drifted
# gets no review at all. Anything a single branch needs goes in a workflow file of its own.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: a review is asked for by applying `needs-review`, a person's review
    # is recorded by applying `human-reviewed`, and adr-conventions rule 9 requires the `adr` label
    # on a pull request that amends an ADR — adding a label after a red run has to re-run the gate.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  # Not `true`. Publication removes the review label, and that removal is an `unlabeled` event whose
  # run would cancel the run still publishing. Bot-triggered runs queue instead of cancelling; human
  # pushes still collapse.
  cancel-in-progress: ${{ !endsWith(github.actor, '[bot]') }}
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares. Omitting one does not run that job with less: it
# makes the whole file an invalid workflow, rejected before any gate runs. The last two are
# docs-review's: `id-token: write` for the OIDC exchange the review action performs, `issues: read`
# for the debt issues a review finding becomes.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

# Referenced by branch, not by commit SHA. A SHA pin is worth having where something advances it:
# exeris-kernel and exeris-tooling pin by SHA because Dependabot's `github-actions` updates move the
# pins there. This repository has no dependabot.yml, so a hand-typed SHA would freeze the gates at
# the day it was typed and say nothing about it. `@main` is the form the organisation's install
# instructions give, and it is honest about what this repository tracks. Revisit together with
# adopting Dependabot.
jobs:
  docs:
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@main
    with:
      # strict, not ramp. ramp fails only on files the pull request touches, which shields a
      # frontmatter backlog nobody in the current pull request created. This repository carries no
      # such backlog, so ramp would shield nothing and only let an untouched file drift. If a
      # backlog appears, drop this to `ramp` rather than dropping the job.
      mode: strict
      # Off: the check enforces Contract / Hot path / Failure modes / Owning ADRs on pages typed
      # `subsystem` or `module`, and docs/ holds no such page.
      section-check: false
      # `agent-check` stays at its default `true`: this repository has an `.agents/` tree, and
      # docs-lint checks it, verifies the vendored bundle against its pin, and fails on an adapter
      # under `.claude/` that differs from its source.
  commits:
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@main
  pr-body:
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@main
  # The review of ADR-085 §J.33, published under the organisation's identity by ADR-087 §B.
  #
  # `needs` puts it after the gates it complements and `l1-results` hands it their conclusions: the
  # reviewer's harness denies the network, so a gate it is asked to read for itself lands in the
  # verdict as `not-run`. `always()`, because a review that vanishes from the checks when its gates go
  # red is the failure this arrangement exists to prevent. A bot's event runs the job too: the
  # publishing half answers it from the standing verdict, and the model does not start on one.
  #
  # THE REVIEW RUNS ON READINESS, not on every push: when the pull request is opened, reopened,
  # marked ready for review, or labelled `needs-review` by a person. A push afterwards leaves the
  # standing verdict covering an older commit, and the check says so until a review is asked for
  # again.
  docs-review:
    needs: [docs, commits, pr-body]
    if: ${{ always() }}
    uses: exeris-systems/.github/.github/workflows/docs-review.yml@main
    with:
      # `docs-review / publish / verdict` is the check this adds, red when the verdict is BLOCKED,
      # absent, invalid, or resting on a mandatory gate that did not run. It is not a required
      # context here; making it one is a branch-protection change, not a change to this file.
      publish: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}"}
      # This repository's own rules, applied after the shared routine's parts and under its
      # severity tags and verdict schema. Read at the BASE commit, never at the pull request's ref:
      # a pull request does not write the rules it is judged by.
      repo-routine: docs/repo-review-rules.md
      # The scripts the agent manifest names under `scripts:`, run by CI because the reviewer may not
      # run them. Their output is evidence for the reviewer, not a gate: a failure here reaches the
      # verdict through the reviewer, and the job stays green. PyYAML first, because the hook
      # dispatcher denies every command when it cannot parse `hooks.yaml`, and the deny check would
      # then report every allowed command as refused. Each script runs whatever the one before it
      # did, and the exit code the reviewer reads is non-zero if any of them failed.
      repo-checks: >-
        pip install --quiet pyyaml;
        rc=0;
        bash tools/hook-deny-check/hook-deny-check.sh || rc=1;
        bash tools/eval-consistency-check/eval-consistency-check.sh || rc=1;
        exit $rc
      # One model run per part, composed into one verdict and one comment. `pr` and `repo` run on
      # every pull request; `docs`, `records`, `code-docs` and `code` where the diff has their
      # files. A part that leaves no verdict makes the check red.
      review-in-parts: true
    # Named, not `secrets: inherit`: the job needs three, and inherit would hand it every secret this
    # repository has.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
  # ADR-085 §F.21, the Java half: doclint and Checkstyle over doc comments, from the organisation's
  # ruleset and pinned engine. The LSP server is an application, not a published API surface, so it
  # sits in `diff-modules`:
  # javadoc-conventions.md rule 11 holds the files a pull request changes, with no backfill mandate.
  # That half runs `javadoc` and Checkstyle directly over the changed files, so it needs no pom
  # change and no `javadoc-gate` profile. `exeris-platform-bom` and `exeris-platform-parent` are
  # pom-packaged and have nothing to document.
  javadoc:
    uses: exeris-systems/.github/.github/workflows/javadoc-gate.yml@main
    with:
      diff-modules: exeris-platform-lsp
