name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    name: mvn install (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['26']

    steps:
      - name: Checkout exeris-platform
        uses: actions/checkout@v4
        with:
          path: exeris-platform

      - name: Checkout exeris-sdk (SNAPSHOT dep)
        uses: actions/checkout@v4
        with:
          repository: exeris-systems/exeris-sdk
          ref: main
          path: exeris-sdk

      - name: Checkout exeris-tooling (SNAPSHOT dep)
        uses: actions/checkout@v4
        with:
          repository: exeris-systems/exeris-tooling
          ref: main
          path: exeris-tooling

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install exeris-sdk to local Maven repo
        working-directory: exeris-sdk
        run: mvn -B -ntp -DskipTests install

      - name: Install exeris-tooling to local Maven repo
        working-directory: exeris-tooling
        run: mvn -B -ntp -DskipTests install

      - name: mvn -B install (exeris-platform)
        working-directory: exeris-platform
        run: mvn -B -ntp install

  frontend:
    name: ng build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: exeris-studio-frontend/package-lock.json

      - name: npm ci
        working-directory: exeris-studio-frontend
        run: npm ci

      - name: ng build
        working-directory: exeris-studio-frontend
        run: npm run build
