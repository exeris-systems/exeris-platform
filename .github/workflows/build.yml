name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    name: mvn install (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # No packages:read and no registry credential anywhere in this job. Every dependency —
    # the Exeris stack included (eu.exeris:exeris-kernel-*, eu.exeris:exeris-sdk-*) — resolves
    # from Maven Central at the versions exeris-platform-bom
    # pins, so a fresh clone builds with nothing but a JDK and Maven.
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, and each row earns its place.
        #
        # 25 is the floor the reactor compiles to (maven.compiler.release in the root POM) and
        # the JDK exeris-platform-lsp's standalone launcher claims to run on. `release 25`
        # settles the bytecode; only building and running LauncherIT under a 25 runtime shows
        # the artifact actually starts there.
        #
        # 26 keeps the newest JDK from breaking silently — the row that would catch a JDK-26
        # regression in a dependency. It reports but does not gate: nothing here needs a JDK above
        # the floor (no preview features), so a 26-only failure is a signal, not a merge blocker.
        #
        # Branch protection on main requires `mvn install (JDK 25)` by name. A job or matrix rename changes the reported name, and a required check that no
        # job reports blocks every pull request, so a rename and the protection update are one
        # change.
        java: ['25', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: mvn -B install
        run: mvn -B -ntp install
